<style>
  :root {
    --bg: #f2ede3;
    --surface: #fcfaf4;
    --surface-soft: #f6f1e7;
    --ink: #25241f;
    --ink-2: #46433a;

    --line-strong: #cec4b1;
    --accent: #b34c33;
    --accent-2: #dc7b5e;
    --accent-soft: #efddd3;
    --good: #526b5b;
    --timer-bg: #24231e;
    --timer-ink: #f4eddf;
    --timer-muted: #aaa18e;
    --timer-line: rgba(244, 237, 223, .13);
    --shadow: 0 34px 70px -46px rgba(49, 40, 27, .55);
    --serif: "Iowan Old Style", "Baskerville", "Georgia", "Songti SC", "STSong", "SimSun", serif;
    --sans: "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  }

  [data-theme="dark"] {
    --bg: #171612;
    --surface: #201f1a;
    --surface-soft: #26241e;
    --ink: #f0eadc;
    --ink-2: #d3ccbc;
    --muted: #a79f8e;
    --faint: #7d7667;
    --line: #39362d;
    --line-strong: #4b473b;
    --accent: #e17a5d;
    --accent-2: #e88b6e;
    --accent-soft: #3b2821;
    --good: #9db8a5;
    --timer-bg: #23221c;
    --timer-ink: #f5eddc;
    --timer-muted: #a9a08d;
    --timer-line: rgba(245, 237, 220, .13);
    --shadow: 0 36px 80px -46px rgba(0, 0, 0, .82);
  }

  * { box-sizing: border-box; }

  html {
    min-height: 100%;
    color-scheme: light;
    scroll-behavior: smooth;
    overflow-x: clip;
  }

  [data-theme="dark"] { color-scheme: dark; }

  body {
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
      radial-gradient(920px 640px at 84% -10%, rgba(179, 76, 51, .11), transparent 63%),
      radial-gradient(900px 620px at -12% 104%, rgba(82, 107, 91, .11), transparent 62%);
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: .16;
    pointer-events: none;
    background-image: radial-gradient(rgba(37, 36, 31, .42) .5px, transparent .65px);
    background-size: 5px 5px;
  }

  [data-theme="dark"] body::after {
    opacity: .1;
    background-image: radial-gradient(rgba(255, 255, 255, .42) .5px, transparent .65px);
  }

  ::selection {
    background: var(--accent-soft);
    color: var(--accent);
  }

  button, input { font: inherit; }

  button { -webkit-tap-highlight-color: transparent; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .shell {

    margin: 0 auto;
  }

  .masthead {
    display: flex;

  .brand {

  .brand-mark {

  .header-meta {

  .date-block { text-align: right; line-height: 1.35; }

  .date-main {

  .date-sub {

  .icon-btn {

  .icon-btn:hover {

  .icon-btn svg { width: 16px; height: 16px; }
  .theme-icon-moon { display: none; }
  [data-theme="dark"] .theme-icon-sun { display: none; }
  [data-theme="dark"] .theme-icon-moon { display: block; }

  .hero {

    align-items: flex-end;
    justify-content: space-between;
    gap: 48px;
    padding: 82px 0 52px;
  }

  .hero-copy { max-width: 820px; min-width: 0; }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 21px;
    color: var(--muted);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: .29em;

  }

  .eyebrow::before {

    height: 1px;

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(42px, 5.3vw, 68px);
    font-weight: 600;
    letter-spacing: -.025em;
    line-height: 1.19;
  }

  h1 .accent {
    position: relative;
    z-index: 0;

  h1 .accent::after {
    content: "";
    position: absolute;
    right: -.04em;
    bottom: .06em;
    left: -.04em;
    z-index: -1;
    height: .19em;
    border-radius: 3px;
    background: var(--accent);
    opacity: .22;

  }

  .lede {

    margin: 24px 0 0;

    font-size: 13.5px;
    line-height: 1.95;
    letter-spacing: .015em;
  }

  .hero-side { flex: 0 0 auto; padding-bottom: 5px; }

  .day-stamp {
    position: relative;
    display: grid;
    place-items: center;
    width: 112px;
    height: 112px;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    color: var(--accent);
    transform: rotate(-7deg);
  }

  .day-stamp::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px dashed var(--line-strong);
    border-radius: 50%;
  }

  .stamp-inner {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    line-height: 1;
    text-align: center;
  }

  .stamp-month, .stamp-year {
    color: var(--muted);
    font-size: 8px;
    letter-spacing: .22em;
  }

  .stamp-day {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -.03em;
    line-height: .95;
  }

  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(330px, .82fr);
    align-items: start;
    gap: 26px;
    padding-bottom: 58px;
  }

  .card {
    border: 1px solid var(--line);
    border-radius: 26px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .tasks-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 488px;
    padding: 29px 30px 23px;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .2em;
    line-height: 1;
    white-space: nowrap;
  }

  .section-label::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  .head-actions {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
  }

  .count-badge {
    min-width: 54px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface-soft);
    color: var(--ink-2);
    font-family: var(--serif);
    font-size: 11.5px;
    line-height: 1.2;
    text-align: center;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .clear-btn {
    padding: 5px 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: none;
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: .025em;
    white-space: nowrap;
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease;
  }

  .clear-btn:hover { color: var(--accent); border-color: var(--accent); }
  .clear-btn[hidden] { display: none; }

  .progress-track {
    height: 3px;
    margin-bottom: 3px;
    overflow: hidden;
    border-radius: 99px;
    background: var(--line);
  }

  .progress-fill {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
    transition: width .45s cubic-bezier(.2, .7, .2, 1);
  }

  .task-list {
    flex: 1;
    min-height: 260px;
    max-height: 390px;
    margin: 0 -10px;
    padding: 0;
    overflow-y: auto;
    list-style: none;
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
  }

  .task-list[hidden] { display: none; }

  .task-list::-webkit-scrollbar { width: 6px; }
  .task-list::-webkit-scrollbar-track { background: transparent; }
  .task-list::-webkit-scrollbar-thumb { border-radius: 99px; background: var(--line-strong); }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 16px 10px;
    border-bottom: 1px solid var(--line);
  }

  .task:last-child { border-bottom: 0; }

  .task-enter { animation: taskIn .32s cubic-bezier(.2, .7, .2, 1) both; }

  @keyframes taskIn {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .check {
    display: grid;
    place-items: center;
    width: 23px;
    height: 23px;
    flex: 0 0 23px;
    margin-top: 1px;
    padding: 0;
    border: 1.4px solid var(--line-strong);
    border-radius: 50%;
    background: transparent;
    color: #fcfaf4;
    cursor: pointer;
    transition: background .22s ease, border-color .22s ease, transform .15s ease;
  }

  .check:hover { border-color: var(--good); transform: scale(1.06); }

  .check svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    transition: stroke-dashoffset .28s ease .04s;
  }

  .task.done .check {
    border-color: var(--good);
    background: var(--good);
  }

  .task.done .check svg { stroke-dashoffset: 0; }

  .task-text {
    flex: 1;
    min-width: 0;
    padding: 1px 0;
    color: var(--ink);
    font-size: 14.5px;
    line-height: 1.6;
    word-break: break-word;
    cursor: text;
    transition: color .25s ease, opacity .25s ease;
  }

  .task.done .task-text {
    color: var(--faint);
    text-decoration: line-through;
    text-decoration-color: var(--faint);
    text-decoration-thickness: 1px;
  }

  .task-text[contenteditable="true"] {
    border-radius: 4px;
    outline: none;
    background: var(--surface-soft);
    box-shadow: 0 0 0 4px var(--surface-soft);
    color: var(--ink);
    text-decoration: none;
  }

  .del {
    display: grid;
    place-items: center;
    width: 27px;
    height: 27px;
    flex: 0 0 27px;
    margin-top: -2px;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--faint);
    opacity: 0;
    cursor: pointer;
    transition: opacity .18s ease, color .18s ease, background .18s ease;
  }

  .del svg { width: 14px; height: 14px; }
  .task:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { background: var(--accent-soft); color: var(--accent); }

  .empty {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 270px;
    padding: 28px 12px 34px;
    text-align: center;
  }

  .empty[hidden] { display: none; }

  .empty-icon {
    display: grid;
    place-items: center;
    width: 54px;
    height: 54px;
    margin-bottom: 15px;
    border: 1px dashed var(--line-strong);
    border-radius: 50%;
    color: var(--accent);
  }

  .empty-icon svg { width: 24px; height: 24px; }

  .empty h2 {
    margin: 0;
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  .empty p {
    margin: 7px 0 16px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
  }

  .chip {
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 11.5px;
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease, background .2s ease, transform .2s ease;
  }

  .chip:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .add-form {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 18px;
    padding: 5px 5px 5px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface-soft);
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  .add-form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .add-form.shake { animation: shake .36s ease; }

  @keyframes shake {
    20%, 60% { transform: translateX(-4px); }
    40%, 80% { transform: translateX(4px); }
  }

  .add-form input {
    width: 100%;
    min-width: 0;
    height: 40px;
    padding: 0;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-size: 13.5px;
  }

  .add-form input::placeholder { color: var(--faint); }

  .add-btn {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: var(--ink);
    color: var(--surface);
    cursor: pointer;
    transition: background .2s ease, transform .2s ease;
  }

  .add-btn svg { width: 16px; height: 16px; }
  .add-btn:hover { background: var(--accent); transform: rotate(90deg); }

  .timer-card {
    --clock-accent: var(--accent-2);
    --clock-button-ink: #241810;
    position: sticky;
    top: 24px;
    overflow: hidden;
    padding: 23px 26px 21px;
    min-height: 488px;
    border-color: transparent;
    background: var(--timer-bg);
    color: var(--timer-ink);
    isolation: isolate;
  }

  [data-theme="dark"] .timer-card { border-color: var(--line); }

  .timer-card::before {
    content: "";
    position: absolute;
    top: -110px;
    right: -110px;
    z-index: -1;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(220, 123, 94, .2), transparent 68%);
    pointer-events: none;
  }

  .timer-card[data-mode="break"] { --clock-accent: #9dbfa4; --clock-button-ink: #162017; }

  .timer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .mode-tabs {
    display: flex;
    padding: 3px;
    border: 1px solid var(--timer-line);
    border-radius: 999px;
    background: rgba(255, 255, 255, .055);
  }

  .mode-btn {
    padding: 7px 14px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--timer-muted);
    font-size: 11px;
    letter-spacing: .06em;
    cursor: pointer;
    transition: background .2s ease, color .2s ease, opacity .2s ease;
  }

  .mode-btn[aria-pressed="true"] {
    background: var(--timer-ink);
    color: var(--timer-bg);
    font-weight: 600;
  }

  .mode-btn:disabled { opacity: .38; cursor: not-allowed; }

  .sound-btn {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    padding: 0;
    border: 1px solid var(--timer-line);
    border-radius: 50%;
    background: transparent;
    color: var(--timer-muted);
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease;
  }

  .sound-btn:hover { border-color: rgba(244, 237, 223, .38); color: var(--timer-ink); }
  .sound-btn svg { width: 15px; height: 15px; }
  .sound-btn .sound-off { display: none; }
  .sound-btn[aria-pressed="false"] .sound-on { display: none; }
  .sound-btn[aria-pressed="false"] .sound-off { display: block; }

  .ring-wrap {
    position: relative;
    width: 250px;
    height: 250px;
    margin: 24px auto 17px;
  }

  .ring { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: var(--timer-line); stroke-width: 5; }
  .ring .progress {
    fill: none;
    stroke: var(--clock-accent);
    stroke-width: 5;
    stroke-linecap: round;
    transition: stroke-dashoffset .26s linear, stroke .3s ease;
  }

  .ring-dot {
    fill: var(--clock-accent);
    filter: drop-shadow(0 0 7px rgba(220, 123, 94, .75));
    transition: fill .3s ease;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .mode-kicker {
    margin-bottom: 8px;
    color: var(--timer-muted);
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: .3em;
    text-transform: uppercase;
  }

  .time {
    font-family: "Iowan Old Style", "Baskerville", "Georgia", "Times New Roman", serif;
    font-size: 50px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .005em;
    line-height: 1;
  }

  .timer-hint {
    max-width: 160px;
    margin-top: 10px;
    color: var(--timer-muted);
    font-size: 10.5px;
    letter-spacing: .03em;
    line-height: 1.5;
    text-align: center;
  }

  .timer-card.is-running .time { text-shadow: 0 0 32px rgba(220, 123, 94, .22); }
  .timer-card.is-running .ring-dot { animation: breathe 2.4s ease-in-out infinite; }

  @keyframes breathe {
    50% { opacity: .42; }
  }

  .timer-actions {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 3px;
  }

  .primary-btn {
    flex: 1;
    height: 48px;
    padding: 0 18px;
    border: 0;
    border-radius: 999px;
    background: var(--clock-accent);
    color: var(--clock-button-ink);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .07em;
    cursor: pointer;
    box-shadow: 0 10px 26px -12px rgba(220, 123, 94, .8);
    transition: background .3s ease, color .3s ease, transform .18s ease, filter .18s ease;
  }

  .primary-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .primary-btn:active { transform: translateY(0); }

  .reset-btn {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    padding: 0;
    border: 1px solid var(--timer-line);
    border-radius: 50%;
    background: transparent;
    color: var(--timer-muted);
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease, transform .2s ease;
  }

  .reset-btn:hover {
    border-color: rgba(244, 237, 223, .38);
    color: var(--timer-ink);
    transform: rotate(-20deg);
  }

  .reset-btn svg { width: 17px; height: 17px; }

  .session-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 19px;
    padding-top: 16px;
    border-top: 1px solid var(--timer-line);
  }

  .stats {
    color: var(--timer-muted);
    font-size: 10.5px;
    letter-spacing: .04em;
    line-height: 1.4;
  }

  .stats b {
    color: var(--timer-ink);
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .round-dots { display: flex; gap: 6px; flex: 0 0 auto; }

  .round-dot {
    width: 6px;
    height: 6px;
    border: 1px solid var(--timer-line);
    border-radius: 50%;
    background: transparent;
    transition: background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }

  .round-dot.on {
    border-color: var(--clock-accent);
    background: var(--clock-accent);
    box-shadow: 0 0 8px rgba(220, 123, 94, .65);
  }

  .page-footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px 32px;
    padding: 22px 0 35px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: .025em;
    line-height: 1.8;
  }

  .footer-note { display: flex; align-items: center; gap: 7px; }

  .footer-note::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--good);
  }

  .shortcuts { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 13px; }

  kbd {
    display: inline-block;
    min-width: 20px;
    padding: 2px 5px;
    border: 1px solid var(--line);
    border-bottom-color: var(--line-strong);
    border-radius: 4px;
    background: var(--surface);
    color: var(--muted);
    font-family: var(--sans);
    font-size: 9px;
    line-height: 1.4;
    text-align: center;
  }

  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    z-index: 100;
    max-width: calc(100vw - 36px);
    padding: 11px 18px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--surface);
    box-shadow: 0 18px 45px -18px rgba(0, 0, 0, .5);
    font-size: 12px;
    letter-spacing: .02em;
    line-height: 1.5;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 14px);
    transition: opacity .25s ease, transform .25s ease;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 980px) {
    .shell { width: min(720px, calc(100% - 42px)); }
    .hero { padding: 61px 0 40px; }
    .hero-side { display: none; }
    .workspace { grid-template-columns: 1fr; gap: 20px; }
    .timer-card { position: static; min-height: 0; }
    .tasks-card { min-height: 440px; }
  }

  @media (max-width: 560px) {
    .shell { width: calc(100% - 28px); }
    .masthead { padding: 18px 0; gap: 14px; }
    .brand { gap: 8px; }
    .brand-mark { width: 28px; height: 28px; }
    .brand-mark svg { width: 25px; height: 25px; }
    .brand-name { font-size: 17px; }
    .brand-sub { display: none; }
    .header-meta { gap: 11px; }
    .date-main { font-size: 11.5px; }
    .date-sub { font-size: 8px; letter-spacing: .16em; }
    .icon-btn { width: 35px; height: 35px; }

    .hero { padding: 43px 0 29px; }
    h1 { font-size: clamp(30px, 8.4vw, 43px); line-height: 1.24; }
    h1 .accent { white-space: normal; }

    .workspace { gap: 16px; padding-bottom: 38px; }

  }

  @media (hover: none) {

  }

  @media (prefers-reduced-motion: reduce) {

</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="brand" aria-label="日课 Daybook">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="5.6" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M16 3.4v3.2M16 25.4v3.2M3.4 16h3.2M25.4 16h3.2M7.1 7.1l2.3 2.3M22.6 22.6l2.3 2.3M24.9 7.1l-2.3 2.3M9.4 22.6l-2.3 2.3"/>
          </g>
        </svg>
      </span>
      <h2 class="brand-name">日课</h2>
      <span class="brand-sub">DAYBOOK</span>
    </div>
    <div class="header-meta">
      <div class="date-block">
        <div class="date-main" id="dateMain">10月25日 · 星期日</div>
        <div class="date-sub" id="dateSub">2026 · AUTUMN</div>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深浅色">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.1"/>
          <path d="M12 2.4v2M12 19.6v2M2.4 12h2M19.6 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
        </svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 14.3A8.2 8.2 0 0 1 9.7 3.8 8.5 8.5 0 1 0 20.2 14.3Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="heroTitle">
      <div class="hero-copy">
        <p class="eyebrow">A quiet place to begin · 留一点空白给自己</p>
        <h1 id="heroTitle"><span id="greeting">下午好。</span><br>把今天收进<span class="accent">几件小事</span>里。</h1>
        <p class="lede">不追赶时间。只把注意力，放回此刻正在做的这一件。</p>
      </div>
      <div class="hero-side" aria-hidden="true">
        <div class="day-stamp">
          <div class="stamp-inner">
            <span class="stamp-month" id="stampMonth">OCT</span>
            <strong class="stamp-day" id="stampDay">25</strong>
            <span class="stamp-year" id="stampYear">2026</span>
          </div>
        </div>
      </div>
    </section>

    <div class="workspace">
      <section class="tasks-card card" aria-labelledby="tasksTitle">
        <div class="card-head">
          <div class="section-label" id="tasksTitle">今日清单</div>
          <div class="head-actions">
            <span class="count-badge" id="countBadge">0 / 0</span>
            <button class="clear-btn" id="clearDone" type="button" hidden>清除已完成</button>
          </div>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <ul class="task-list" id="taskList" aria-label="今日任务" hidden></ul>

        <div class="empty" id="emptyState">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <circle cx="16" cy="16" r="6.2"/>
              <path d="M16 3v3.2M16 25.8V29M3 16h3.2M25.8 16H29M6.8 6.8l2.3 2.3M22.9 22.9l2.3 2.3M25.2 6.8l-2.3 2.3M9.1 22.9l-2.3 2.3"/>
            </svg>
          </div>
          <h2>清单还空着</h2>
          <p>不用写满。先放下一件真正想完成的事。</p>
          <div class="suggestions" aria-label="试试添加">
            <button class="chip" type="button" data-suggest="读十页书">读十页书</button>
            <button class="chip" type="button" data-suggest="整理桌面">整理桌面</button>
            <button class="chip" type="button" data-suggest="写三行日记">写三行日记</button>
          </div>
        </div>

        <form class="add-form" id="addForm" autocomplete="off">
          <input id="taskInput" type="text" maxlength="80" placeholder="下一件小事是什么？" aria-label="新任务内容">
          <button class="add-btn" type="submit" aria-label="添加任务">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </form>
      </section>

      <aside class="timer-card card" id="timerCard" data-mode="focus" aria-label="专注计时器">
        <div class="timer-top">
          <div class="mode-tabs" role="group" aria-label="计时模式">
            <button class="mode-btn" id="focusMode" type="button" data-mode="focus" aria-pressed="true">专注</button>
            <button class="mode-btn" id="breakMode" type="button" data-mode="break" aria-pressed="false">小憩</button>
          </div>
          <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="关闭提示音" title="提示音">
            <svg class="sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 5 6.6 8.7H3.5v6.6h3.1L11 19V5Z"/>
              <path d="M15 9.1a4.1 4.1 0 0 1 0 5.8M17.8 6.3a7.8 7.8 0 0 1 0 11.4"/>
            </svg>
            <svg class="sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 5 6.6 8.7H3.5v6.6h3.1L11 19V5Z"/>
              <path d="m15.2 9.4 4.6 5.2M19.8 9.4l-4.6 5.2"/>
            </svg>
          </button>
        </div>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
            <circle class="track" cx="120" cy="120" r="100"/>
            <circle class="progress" id="ringProgress" cx="120" cy="120" r="100"/>
            <circle class="ring-dot" id="ringDot" cx="120" cy="20" r="4.5"/>
          </svg>
          <div class="ring-center">
            <span class="mode-kicker" id="modeKicker">FOCUS</span>
            <div class="time" id="timerDisplay">25:00</div>
            <div class="timer-hint" id="timerHint">二十五分钟，只做这一件</div>
          </div>
        </div>

        <div class="timer-actions">
          <button class="primary-btn" id="startBtn" type="button">开始专注</button>
          <button class="reset-btn" id="resetBtn" type="button" aria-label="重置计时器" title="重置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/>
              <path d="M4.5 4.5V9H9"/>
            </svg>
          </button>
        </div>

        <div class="session-row">
          <div class="stats">今日 <b id="statMinutes">0</b> 分钟 · <b id="statRounds">0</b> 轮</div>
          <div class="round-dots" id="roundDots" aria-hidden="true">
            <span class="round-dot"></span>
            <span class="round-dot"></span>
            <span class="round-dot"></span>
            <span class="round-dot"></span>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="page-footer">
    <span class="footer-note">本地保存 · 无需联网 · 刷新不丢失</span>
    <span class="shortcuts">
      <span><kbd>Enter</kbd> 添加</span>
      <span><kbd>Space</kbd> 开始 / 暂停</span>
      <span><kbd>N</kbd> 写一件小事</span>
      <span>双击任务可修改</span>
    </span>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="taskTemplate">
  <li class="task">
    <button class="check" type="button" role="checkbox" aria-checked="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.2 8.4 3.1 3.1 6.5-7"/></svg>

    <span class="task-text" title="双击修改"></span>
    <button class="del" type="button" aria-label="删除任务">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h16M9 7V4.5h6V7M6.5 7l.8 12.5h9.4L17.5 7M10 10.5v6M14 10.5v6"/>
      </svg>
    </button>
  </li>
</template>

<script>
(function () {
  'use strict';

  var FOCUS_SECONDS = 25 * 60;
  var BREAK_SECONDS = 5 * 60;
  var STATE_KEY = 'daybook.state.v1';
  var THEME_KEY = 'daybook.theme.v1';
  var RING_RADIUS = 100;
  var RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

  var $ = function (id) { return document.getElementById(id); };
  var refs = {
    dateMain: $('dateMain'),
    dateSub: $('dateSub'),
    stampMonth: $('stampMonth'),
    stampDay: $('stampDay'),
    stampYear: $('stampYear'),
    greeting: $('greeting'),
    themeBtn: $('themeBtn'),
    countBadge: $('countBadge'),
    clearDone: $('clearDone'),
    progressFill: $('progressFill'),
    taskList: $('taskList'),
    emptyState: $('emptyState'),
    taskTemplate: $('taskTemplate'),
    addForm: $('addForm'),
    taskInput: $('taskInput'),
    timerCard: $('timerCard'),
    focusMode: $('focusMode'),
    breakMode: $('breakMode'),
    soundBtn: $('soundBtn'),
    modeKicker: $('modeKicker'),
    timerDisplay: $('timerDisplay'),
    timerHint: $('timerHint'),
    ringProgress: $('ringProgress'),
    ringDot: $('ringDot'),
    startBtn: $('startBtn'),
    resetBtn: $('resetBtn'),
    statMinutes: $('statMinutes'),
    statRounds: $('statRounds'),
    roundDots: $('roundDots'),
    toast: $('toast')
  };

  var CHINESE_WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  var ENGLISH_MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  var SEASONS = ['WINTER', 'WINTER', 'SPRING', 'SPRING', 'SPRING', 'SUMMER', 'SUMMER', 'SUMMER', 'AUTUMN', 'AUTUMN', 'AUTUMN', 'WINTER'];

  var tickHandle = null;
  var toastHandle = null;
  var audioContext = null;

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function dayKey(date) {
    return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
  }

  function defaultState() {
    var today = dayKey(new Date());
    return {
      version: 1,
      day: today,
      tasks: [],
      stats: { day: today, sessions: 0, minutes: 0 },
      timer: { mode: 'focus', running: false, remaining: FOCUS_SECONDS, endAt: null },
      sound: true
    };
  }

  function clampInt(value, min, max, fallback) {
    var n = Number(value);
    if (!Number.isFinite(n)) return fallback;
    n = Math.round(n);
    return Math.min(max, Math.max(min, n));
  }

  function makeId() {
    try {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    } catch (e) {}
    return 't-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  }

  function loadState() {
    var fresh = defaultState();
    var raw = null;
    try { raw = localStorage.getItem(STATE_KEY); } catch (e) { return fresh; }
    if (!raw) return fresh;

    try {
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return fresh;

      var state = defaultState();
      state.day = typeof parsed.day === 'string' ? parsed.day : state.day;
      state.sound = parsed.sound !== false;

      if (Array.isArray(parsed.tasks)) {
        state.tasks = parsed.tasks.filter(function (task) {
          return task && typeof task.id === 'string' && typeof task.text === 'string';
        }).slice(0, 200).map(function (task) {
          return {
            id: task.id,
            text: task.text.trim().slice(0, 80),
            done: task.done === true
          };
        }).filter(function (task) { return task.text.length > 0; });
      }

      if (parsed.stats && typeof parsed.stats === 'object') {
        state.stats = {
          day: typeof parsed.stats.day === 'string' ? parsed.stats.day : state.stats.day,
          sessions: clampInt(parsed.stats.sessions, 0, 999, 0),
          minutes: clampInt(parsed.stats.minutes, 0, 9999, 0)
        };
      }

      if (parsed.timer && typeof parsed.timer === 'object') {
        var mode = parsed.timer.mode === 'break' ? 'break' : 'focus';
        var duration = mode === 'break' ? BREAK_SECONDS : FOCUS_SECONDS;
        var remaining = clampInt(parsed.timer.remaining, 0, duration, duration);
        var endAt = Number(parsed.timer.endAt);
        var running = parsed.timer.running === true && Number.isFinite(endAt) && endAt > 0;
        state.timer = {
          mode: mode,
          running: running,
          remaining: remaining,
          endAt: running ? endAt : null
        };
      }

      return state;
    } catch (e) {
      return fresh;
    }
  }

  var state = loadState();

  function saveState() {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    } catch (e) {
      /* 隐私模式或本地存储不可用时，页面仍然可用，只是不记忆。 */
    }
  }

  function durationFor(mode) {
    return mode === 'break' ? BREAK_SECONDS : FOCUS_SECONDS;
  }

  function formatTime(seconds) {
    seconds = Math.max(0, Math.round(seconds));
    return pad2(Math.floor(seconds / 60)) + ':' + pad2(seconds % 60);
  }

  function toast(message, duration) {
    refs.toast.textContent = message;
    refs.toast.classList.add('show');
    window.clearTimeout(toastHandle);
    toastHandle = window.setTimeout(function () {
      refs.toast.classList.remove('show');
    }, duration || 2800);
  }

  function checkDayRollover() {
    var today = dayKey(new Date());
    var changed = false;

    if (state.day !== today) {
      /* 新的一天：留下没做完的，收走已完成的。 */
      state.tasks = state.tasks.filter(function (task) { return !task.done; });
      state.day = today;
      changed = true;
    }

    if (state.stats.day !== today) {
      state.stats = { day: today, sessions: 0, minutes: 0 };
      changed = true;
    }

    if (changed) saveState();
    return changed;
  }

  function greetingForHour(hour) {
    if (hour < 5) return '夜深了。';
    if (hour < 9) return '早上好。';
    if (hour < 12) return '上午好。';
    if (hour < 14) return '中午好。';
    if (hour < 18) return '下午好。';
    if (hour < 23) return '晚上好。';
    return '夜深了。';
  }

  function updateDateChrome() {
    var now = new Date();
    refs.dateMain.textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日 · ' + CHINESE_WEEKDAYS[now.getDay()];
    refs.dateSub.textContent = now.getFullYear() + ' · ' + SEASONS[now.getMonth()];
    refs.stampMonth.textContent = ENGLISH_MONTHS[now.getMonth()];
    refs.stampDay.textContent = String(now.getDate());
    refs.stampYear.textContent = String(now.getFullYear());
    refs.greeting.textContent = greetingForHour(now.getHours());
  }

  function syncThemeButton() {
    var isDark = document.documentElement.dataset.theme === 'dark';
    refs.themeBtn.setAttribute('aria-label', isDark ? '切换到浅色模式' : '切换到深色模式');
    refs.themeBtn.title = isDark ? '切换到浅色模式' : '切换到深色模式';
  }

  function toggleTheme() {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    syncThemeButton();
  }

  function renderTasks(newTaskId) {
    var total = state.tasks.length;
    var done = 0;
    var fragment = document.createDocumentFragment();

    state.tasks.forEach(function (task) {
      if (task.done) done += 1;

      var node = refs.taskTemplate.content.firstElementChild.cloneNode(true);
      var check = node.querySelector('.check');
      var text = node.querySelector('.task-text');
      var del = node.querySelector('.del');

      node.dataset.id = task.id;
      if (task.done) node.classList.add('done');
      if (newTaskId && task.id === newTaskId) node.classList.add('task-enter');

      check.setAttribute('aria-checked', task.done ? 'true' : 'false');
      check.setAttribute('aria-label', (task.done ? '标记未完成：' : '标记完成：') + task.text);
      text.textContent = task.text;
      del.setAttribute('aria-label', '删除任务：' + task.text);

      fragment.appendChild(node);
    });

    refs.taskList.replaceChildren(fragment);
    refs.taskList.hidden = total === 0;
    refs.emptyState.hidden = total !== 0;
    updateTaskMeta(total, done);
  }

  function findTaskNode(id) {
    var nodes = refs.taskList.querySelectorAll('.task');
    for (var i = 0; i < nodes.length; i += 1) {
      if (nodes[i].dataset.id === id) return nodes[i];
    }
    return null;
  }

  function updateTaskMeta(total, done) {
    if (typeof total !== 'number') total = state.tasks.length;
    if (typeof done !== 'number') {
      done = state.tasks.reduce(function (sum, task) { return sum + (task.done ? 1 : 0); }, 0);
    }

    refs.countBadge.textContent = done + ' / ' + total;
    refs.progressFill.style.width = total ? ((done / total) * 100) + '%' : '0%';
    refs.clearDone.hidden = done === 0;
    refs.taskList.hidden = total === 0;
    refs.emptyState.hidden = total !== 0;
  }

  function addTask(text, fromSuggestion) {
    text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 80);
    if (!text) return false;

    if (state.tasks.length >= 200) {
      toast('清单最多放 200 件小事。');
      return false;
    }

    var task = { id: makeId(), text: text, done: false };
    state.tasks.push(task);
    saveState();
    renderTasks(task.id);

    var item = findTaskNode(task.id);
    if (item) {
      try { item.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
    }

    if (!fromSuggestion) refs.taskInput.focus();
    return true;
  }

  function toggleTask(id) {
    var task = state.tasks.find(function (item) { return item.id === id; });
    if (!task) return;

    task.done = !task.done;
    saveState();

    var node = findTaskNode(id);
    if (node) {
      var check = node.querySelector('.check');
      node.classList.toggle('done', task.done);
      check.setAttribute('aria-checked', task.done ? 'true' : 'false');
      check.setAttribute('aria-label', (task.done ? '标记未完成：' : '标记完成：') + task.text);
    }

    updateTaskMeta();
    if (task.done && state.tasks.length > 0 && state.tasks.every(function (item) { return item.done; })) {
      toast('今天的清单，全部完成了。');
    }
  }

  function deleteTask(id) {
    var before = state.tasks.length;
    state.tasks = state.tasks.filter(function (task) { return task.id !== id; });
    if (state.tasks.length === before) return;
    saveState();
    renderTasks();
  }

  function clearCompleted() {
    var count = state.tasks.filter(function (task) { return task.done; }).length;
    if (!count) return;
    state.tasks = state.tasks.filter(function (task) { return !task.done; });
    saveState();
    renderTasks();
    toast('已清除 ' + count + ' 件完成的小事。');
  }

  function beginEdit(textNode, task) {
    if (textNode.isContentEditable) return;

    var original = task.text;
    var finished = false;

    textNode.contentEditable = 'true';
    textNode.setAttribute('aria-label', '编辑任务，回车保存');
    textNode.focus();

    try {
      var selection = window.getSelection();
      var range = document.createRange();
      range.selectNodeContents(textNode);
      selection.removeAllRanges();
      selection.addRange(range);
    } catch (e) {}

    function finish(commit) {
      if (finished) return;
      finished = true;

      textNode.contentEditable = 'false';
      textNode.removeAttribute('aria-label');

      var next = String(textNode.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 80);
      if (!commit || !next) next = original;

      if (next !== original) {
        task.text = next;
        saveState();
        renderTasks();
      } else {
        textNode.textContent = original;
      }
    }

    textNode.addEventListener('blur', function () { finish(true); }, { once: true });

    textNode.addEventListener('keydown', function (event) {
      if (event.isComposing || event.keyCode === 229) return;

      if (event.key === 'Enter') {
        event.preventDefault();
        textNode.blur();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        finish(false);
        textNode.blur();
      }
    });

    textNode.addEventListener('paste', function (event) {
      event.preventDefault();
      var pasted = '';
      try {
        pasted = (event.clipboardData || window.clipboardData).getData('text');
      } catch (e) {}
      pasted = String(pasted || '').replace(/\s+/g, ' ').slice(0, 80);
      if (pasted) {
        try { document.execCommand('insertText', false, pasted); } catch (e) {}
      }
    });
  }

  function renderTimer() {
    var timer = state.timer;
    var mode = timer.mode;
    var duration = durationFor(mode);
    var remaining = Math.min(duration, Math.max(0, Math.round(timer.remaining)));

    refs.timerCard.dataset.mode = mode;
    refs.timerCard.classList.toggle('is-running', timer.running);
    refs.focusMode.setAttribute('aria-pressed', mode === 'focus' ? 'true' : 'false');
    refs.breakMode.setAttribute('aria-pressed', mode === 'break' ? 'true' : 'false');
    refs.focusMode.setAttribute('aria-disabled', timer.running ? 'true' : 'false');
    refs.breakMode.setAttribute('aria-disabled', timer.running ? 'true' : 'false');

    refs.timerDisplay.textContent = formatTime(remaining);
    refs.modeKicker.textContent = mode === 'focus' ? 'FOCUS' : 'BREAK';

    var hint;
    if (timer.running) {
      hint = mode === 'focus' ? '正在专注 · 一次只做一件事' : '正在休息 · 离开屏幕一会儿';
    } else if (remaining < duration) {
      hint = '已暂停 · 随时回来';
    } else {
      hint = mode === 'focus' ? '二十五分钟，只做这一件' : '五分钟，让眼睛休息';
    }
    refs.timerHint.textContent = hint;

    var ratio = duration > 0 ? remaining / duration : 0;
    refs.ringProgress.style.strokeDasharray = RING_CIRCUMFERENCE + ' ' + RING_CIRCUMFERENCE;
    refs.ringProgress.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - ratio));

    var angle = ratio * Math.PI * 2;
    refs.ringDot.setAttribute('cx', String(120 + RING_RADIUS * Math.cos(angle)));
    refs.ringDot.setAttribute('cy', String(120 + RING_RADIUS * Math.sin(angle)));
    refs.ringDot.style.opacity = remaining > 0 ? '1' : '0';

    if (timer.running) {
      refs.startBtn.textContent = '暂停一下';
      refs.startBtn.setAttribute('aria-label', '暂停' + (mode === 'focus' ? '专注' : '休息') + '计时');
    } else if (remaining < duration) {
      refs.startBtn.textContent = mode === 'focus' ? '继续专注' : '继续休息';
      refs.startBtn.setAttribute('aria-label', '继续' + (mode === 'focus' ? '专注' : '休息') + '计时');
    } else {
      refs.startBtn.textContent = mode === 'focus' ? '开始专注' : '开始小憩';
      refs.startBtn.setAttribute('aria-label', '开始' + (mode === 'focus' ? '专注' : '休息') + '计时');
    }

    updateDocumentTitle();
  }

  function updateDocumentTitle() {
    var base = '日课 · 今日清单与专注钟';
    var timer = state.timer;
    if (timer.running) {
      document.title = formatTime(timer.remaining) + ' · ' + (timer.mode === 'focus' ? '专注' : '小憩') + ' — 日课';
    } else if (timer.remaining < durationFor(timer.mode)) {
      document.title = formatTime(timer.remaining) + ' · 已暂停 — 日课';
    } else {
      document.title = base;
    }
  }

  function renderStats() {
    refs.statMinutes.textContent = String(state.stats.minutes);
    refs.statRounds.textContent = String(state.stats.sessions);

    var cycle = state.stats.sessions === 0 ? 0 : ((state.stats.sessions - 1) % 4) + 1;
    Array.prototype.forEach.call(refs.roundDots.children, function (dot, index) {
      dot.classList.toggle('on', index < cycle);
    });
  }

  function renderSound() {
    refs.soundBtn.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
    refs.soundBtn.setAttribute('aria-label', state.sound ? '关闭提示音' : '开启提示音');
    refs.soundBtn.title = state.sound ? '关闭提示音' : '开启提示音';
  }

  function primeAudio() {
    if (!state.sound) return;
    try {
      var AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      if (!audioContext) audioContext = new AudioCtor();
      if (audioContext.state === 'suspended') {
        var resume = audioContext.resume();
        if (resume && typeof resume.catch === 'function') resume.catch(function () {});
      }
    } catch (e) {}
  }

  function playTone(frequency, delay, length, volume) {
    if (!audioContext) return;
    try {
      var osc = audioContext.createOscillator();
      var gain = audioContext.createGain();
      var start = audioContext.currentTime + delay;
      var end = start + length;

      osc.type = 'sine';
      osc.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume || 0.035, start + 0.035);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);

      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(start);
      osc.stop(end + 0.05);
    } catch (e) {}
  }

  function playChime(isFocus) {
    if (!state.sound) return;
    primeAudio();
    if (!audioContext) return;
    var notes = isFocus ? [523.25, 659.25, 783.99] : [659.25, 523.25];
    notes.forEach(function (note, index) {
      playTone(note, index * 0.17, 1.05, 0.032);
    });
  }

  function startTicking() {
    if (tickHandle) return;
    tickHandle = window.setInterval(tickTimer, 250);
  }

  function stopTicking() {
    if (!tickHandle) return;
    window.clearInterval(tickHandle);
    tickHandle = null;
  }

  function tickTimer() {
    var timer = state.timer;
    if (!timer.running || !timer.endAt) {
      stopTicking();
      return;
    }

    var left = Math.ceil((timer.endAt - Date.now()) / 1000);
    if (left <= 0) {
      timer.remaining = 0;
      finishTimer(false);
      return;
    }

    if (left !== timer.remaining) {
      timer.remaining = left;
      renderTimer();
    }
  }

  function startTimer() {
    var timer = state.timer;
    var duration = durationFor(timer.mode);

    primeAudio();

    if (timer.remaining <= 0 || timer.remaining > duration) timer.remaining = duration;
    timer.running = true;
    timer.endAt = Date.now() + timer.remaining * 1000;

    saveState();
    renderTimer();
    startTicking();
  }

  function pauseTimer() {
    var timer = state.timer;
    if (!timer.running) return;

    var left = Math.ceil((timer.endAt - Date.now()) / 1000);
    if (left <= 0) {
      timer.remaining = 0;
      finishTimer(false);
      return;
    }

    timer.remaining = left;
    timer.running = false;
    timer.endAt = null;
    saveState();
    stopTicking();
    renderTimer();
  }

  function finishTimer(silent) {
    var wasFocus = state.timer.mode === 'focus';

    stopTicking();
    state.timer.running = false;
    state.timer.endAt = null;
    state.timer.remaining = 0;

    if (wasFocus) {
      checkDayRollover();
      state.stats.sessions = Math.min(999, state.stats.sessions + 1);
      state.stats.minutes = Math.min(9999, state.stats.minutes + Math.round(FOCUS_SECONDS / 60));
      state.timer.mode = 'break';
      state.timer.remaining = BREAK_SECONDS;
      if (!silent) toast('这一轮完成了。起来伸个懒腰吧。', 3600);
    } else {
      state.timer.mode = 'focus';
      state.timer.remaining = FOCUS_SECONDS;
      if (!silent) toast('休息结束。回来，继续手上的事。', 3300);
    }

    saveState();
    renderTimer();
    renderStats();
    if (!silent) playChime(wasFocus);
  }

  function resetTimer() {
    stopTicking();
    state.timer.running = false;
    state.timer.endAt = null;
    state.timer.remaining = durationFor(state.timer.mode);
    saveState();
    renderTimer();
  }

  function switchMode(mode) {
    if (state.timer.running) {
      toast('先暂停，再切换模式。');
      return;
    }
    if (mode !== 'focus' && mode !== 'break') return;
    state.timer.mode = mode;
    state.timer.remaining = durationFor(mode);
    state.timer.running = false;
    state.timer.endAt = null;
    saveState();
    renderTimer();
  }

  function restoreTimerIfNeeded() {
    var timer = state.timer;
    if (!timer.running || !timer.endAt) return;

    var left = Math.ceil((timer.endAt - Date.now()) / 1000);
    if (left <= 0) {
      finishTimer(true);
      toast('上一轮计时已经完成。');
      return;
    }

    var limit = durationFor(timer.mode);
    if (left > limit) {
      left = limit;
      timer.endAt = Date.now() + left * 1000;
      saveState();
    }

    timer.remaining = left;
    startTicking();
  }

  function toggleSound() {
    state.sound = !state.sound;
    saveState();
    renderSound();

    if (state.sound) {
      primeAudio();
      playTone(880, 0, 0.18, 0.025);
      toast('提示音已开启。');
    } else {
      toast('提示音已关闭。');
    }
  }

  function bindEvents() {
    refs.themeBtn.addEventListener('click', toggleTheme);

    refs.addForm.addEventListener('submit', function (event) {
      event.preventDefault();
      var value = refs.taskInput.value;
      if (!value.trim()) {
        refs.addForm.classList.remove('shake');
        void refs.addForm.offsetWidth;
        refs.addForm.classList.add('shake');
        window.setTimeout(function () { refs.addForm.classList.remove('shake'); }, 420);
        refs.taskInput.focus();
        return;
      }
      if (addTask(value, false)) refs.taskInput.value = '';
    });

    document.querySelectorAll('[data-suggest]').forEach(function (button) {
      button.addEventListener('click', function () {
        addTask(button.dataset.suggest, true);
      });
    });

    refs.taskList.addEventListener('click', function (event) {
      var button = event.target.closest('button');
      if (!button) return;
      var node = button.closest('.task');
      if (!node) return;
      if (button.classList.contains('check')) toggleTask(node.dataset.id);
      if (button.classList.contains('del')) deleteTask(node.dataset.id);
    });

    refs.taskList.addEventListener('dblclick', function (event) {
      var textNode = event.target.closest('.task-text');
      if (!textNode) return;
      var node = textNode.closest('.task');
      var task = state.tasks.find(function (item) { return item.id === node.dataset.id; });
      if (task) beginEdit(textNode, task);
    });

    refs.clearDone.addEventListener('click', clearCompleted);

    refs.startBtn.addEventListener('click', function () {
      if (state.timer.running) pauseTimer();
      else startTimer();
    });

    refs.resetBtn.addEventListener('click', resetTimer);
    refs.focusMode.addEventListener('click', function () { switchMode('focus'); });
    refs.breakMode.addEventListener('click', function () { switchMode('break'); });
    refs.soundBtn.addEventListener('click', toggleSound);

    document.addEventListener('keydown', function (event) {
      var target = event.target;
      var tag = target && target.tagName ? target.tagName : '';
      var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (target && target.isContentEditable);

      if (typing || event.metaKey || event.ctrlKey || event.altKey) return;

      if (event.code === 'Space') {
        if (target && target.closest && target.closest('button')) return;
        event.preventDefault();
        if (state.timer.running) pauseTimer();
        else startTimer();
      } else if (event.key === 'n' || event.key === 'N') {
        event.preventDefault();
        refs.taskInput.focus();
      }
    });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        saveState();
      } else {
        tickTimer();
        if (checkDayRollover()) {
          renderTasks();
          renderStats();
        }
        updateDateChrome();
      }
    });

    window.addEventListener('pagehide', saveState);

    window.addEventListener('storage', function (event) {
      if (event.key !== STATE_KEY || !event.newValue) return;
      try {
        var next = JSON.parse(event.newValue);
        if (!next || typeof next !== 'object') return;
        /* 另一个标签页更新了数据：采用它，避免两边互相覆盖。 */
        state = loadState();
        checkDayRollover();
        renderTasks();
        renderStats();
        renderTimer();
        renderSound();
        if (state.timer.running) startTicking();
        else stopTicking();
      } catch (e) {}
    });
  }

  function init() {
    document.documentElement.style.setProperty('--ring-length', RING_CIRCUMFERENCE);

    checkDayRollover();
    updateDateChrome();
    syncThemeButton();
    renderTasks();
    renderStats();
    renderSound();
    renderTimer();
    restoreTimerIfNeeded();
    bindEvents();

    window.setInterval(function () {
      updateDateChrome();
      if (checkDayRollover()) {
        renderTasks();
        renderStats();
        renderTimer();
      }
    }, 60000);
  }

  init();
})();
</script>
</body>
</html>
